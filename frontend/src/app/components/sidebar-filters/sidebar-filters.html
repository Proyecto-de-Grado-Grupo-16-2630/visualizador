<aside class="sidebar">
  <div class="sidebar-header">
    <div class="title-group">
      <h2>Visualizador Vial</h2>
      <span class="badge">Bogotá D.C.</span>
    </div>
    <p class="subtitle">Análisis geoespacial de red vial y movilidad</p>
  </div>

  <div class="sidebar-content">
    <section class="control-card">
      <div class="section-title">
        <span class="icon">📍</span>
        <h3>Sectorización Espacial</h3>
      </div>
      
      <div class="field-group">
        <label for="locality-select">Localidad de Bogotá:</label>
        <div class="select-wrapper">
          <select id="locality-select" (change)="onLocalityChange($event)" [value]="mapState.selectedLocality()">
            <option value="none">Seleccionar localidad...</option>
            <option value="all_city">Toda Bogotá (Todas las localidades)</option>
            <option value="usaquen">Usaquén</option>
            <option value="chapinero">Chapinero</option>
            <option value="santafe">Santa Fe</option>
            <option value="sancristobal">San Cristóbal</option>
            <option value="usme">Usme</option>
            <option value="tunjuelito">Tunjuelito</option>
            <option value="bosa">Bosa</option>
            <option value="kennedy">Kennedy</option>
            <option value="fontibon">Fontibón</option>
            <option value="engativa">Engativá</option>
            <option value="suba">Suba</option>
            <option value="barriosunidos">Barrios Unidos</option>
            <option value="teusaquillo">Teusaquillo</option>
            <option value="losmartires">Los Mártires</option>
            <option value="antonionarino">Antonio Nariño</option>
            <option value="puentearanda">Puente Aranda</option>
            <option value="lacandelaria">La Candelaria</option>
            <option value="rafaeluribe">Rafael Uribe Uribe</option>
            <option value="ciudadbolivar">Ciudad Bolívar</option>
            <option value="sumapaz">Sumapaz</option>
          </select>
        </div>
      </div>

      <div class="field-group" *ngIf="mapState.selectedLocality() !== 'none'">
        <label for="road-search">Buscar vía en el sector:</label>
        <div class="search-box">
          <input
            id="road-search"
            type="text"
            placeholder="Ej: Carrera 7, Calle 26..."
            [(ngModel)]="searchQueryText"
            (keyup.enter)="onSearch()"
          />
          <button type="button" class="btn-search-action" (click)="onSearch()">
            Buscar
          </button>
        </div>

        <div class="search-actions-row" *ngIf="mapState.activeSearchQuery().length > 0">
          <label class="isolate-label">
            <input
              type="checkbox"
              [checked]="mapState.isolateSearchedRoad()"
              (change)="onToggleIsolate()"
            />
            Ocultar las demás vías
          </label>
          <button
            type="button"
            class="btn-clear-search"
            (click)="onClearSearch()"
          >
            ✕ Quitar
          </button>
        </div>
      </div>
    </section>

    <section class="control-card" *ngIf="mapState.selectedLocality() !== 'none'">
      <div class="section-title">
        <span class="icon">🛣️</span>
        <h3>Jerarquía Vial</h3>
      </div>
      
      <div class="hierarchy-list">
        <label class="hierarchy-item">
          <input
            type="checkbox"
            [checked]="mapState.selectedRoadTypes()['primary']"
            (change)="onToggleType('primary')"
          />
          <span class="custom-check"></span>
          <div class="hierarchy-meta">
            <span class="hierarchy-name">Vías Arteriales y Troncales</span>
            <span class="hierarchy-desc">Autopistas, avenidas principales</span>
          </div>
        </label>

        <label class="hierarchy-item">
          <input
            type="checkbox"
            [checked]="mapState.selectedRoadTypes()['secondary']"
            (change)="onToggleType('secondary')"
          />
          <span class="custom-check"></span>
          <div class="hierarchy-meta">
            <span class="hierarchy-name">Vías Secundarias</span>
            <span class="hierarchy-desc">Conexión interbarrial continua</span>
          </div>
        </label>

        <label class="hierarchy-item">
          <input
            type="checkbox"
            [checked]="mapState.selectedRoadTypes()['tertiary']"
            (change)="onToggleType('tertiary')"
          />
          <span class="custom-check"></span>
          <div class="hierarchy-meta">
            <span class="hierarchy-name">Vías Colectoras</span>
            <span class="hierarchy-desc">Distribución local intermedia</span>
          </div>
        </label>

        <label class="hierarchy-item">
          <input
            type="checkbox"
            [checked]="mapState.selectedRoadTypes()['residential']"
            (change)="onToggleType('residential')"
          />
          <span class="custom-check"></span>
          <div class="hierarchy-meta">
            <span class="hierarchy-name">Vías Residenciales</span>
            <span class="hierarchy-desc">Acceso predial y barrial</span>
          </div>
        </label>
      </div>
    </section>
  </div>

  <div class="sidebar-footer">
    <button
      class="btn-reset"
      (click)="resetFilters()"
      [disabled]="mapState.selectedLocality() === 'none'"
    >
      Restablecer Vista General
    </button>
  </div>
</aside>
